<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKADEV AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        AKADEV AI /// V.2.0
    </header>

    <div class="chat-box" id="chatBox">
        <div class="message bot">Halo! Gue AI Akadev. Mau bahas apa?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ketik pesan..." autocomplete="off">
        <button onclick="sendMessage()">KIRIM</button>
    </div>
</div>

<script>
    // --- PENTING: ALAMAT BACKEND (OTAK) ---
    // Pastikan domain ini HANYA mengarah ke Pterodactyl, bukan ke Vercel.
    const API_URL = "https://apiai.akadev.me/chat"; 

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');

    userInput.addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });

    async function sendMessage() {
        const text = userInput.value;
        if (!text.trim()) return;

        // Tampilkan Chat User
        addMessage(text, 'user');
        userInput.value = '';

        // Tampilkan Loading
        const loading = addMessage("Sedang mengetik...", 'bot', true);

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text })
            });

            const data = await response.json();
            loading.remove(); // Hapus loading

            if (data.status) {
                addMessage(data.reply, 'bot');
            } else {
                addMessage("Error: " + data.message, 'bot');
            }
        } catch (error) {
            loading.remove();
            addMessage("Gagal konek! Pastikan domain apiai.akadev.me TIDAK nyangkut di Vercel.", 'bot');
        }
    }

    function addMessage(text, sender, isLoading = false) {
        const div = document.createElement('div');
        div.classList.add('message', sender);
        div.innerText = text;
        if(isLoading) div.classList.add('loading');
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }
</script>
</body>
</html>
